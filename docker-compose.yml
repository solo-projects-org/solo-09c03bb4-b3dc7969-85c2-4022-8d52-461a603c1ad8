services:
  case-report-seal:
    build: .
    image: case-report-seal:1.0.0
    container_name: case-report-seal
    ports:
      - "8000:8000"
    environment:
      CASE_REPORT_DB: /data/reports.db
    volumes:
      - case-report-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  case-report-data:
